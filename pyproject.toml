[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-switch"
version = "0.1.2"
description = "Granite Switch: Composable model building"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.11.0",
    "transformers>=5.16,<=5.17.0",
    "jinja2>=3.1",
]

[project.urls]
Repository = "https://github.com/generative-computing/granite-switch"
Documentation = "https://github.com/generative-computing/granite-switch/tree/main/tutorials"

[project.optional-dependencies]
hf = ["accelerate>=0.20.0"]
# Every line from 0.26 through 0.32 is supported by one tree; the backend uses
# capability checks rather than version comparisons where the two differ. Prefer
# probing an API's SHAPE over its mere existence: 0.31 reintroduced the
# multimodal `_call_hf_processor` hook that 0.29 had deleted, but with a
# different signature, so `hasattr` alone reads 0.26-0.28 and 0.31+ as the same
# thing (see src/granite_switch/vllm/audio/processor.py).
# Pin a specific line with the per-line dependency groups below.
vllm = ["vllm>=0.26.0,<0.33.0"]
compose = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]
build = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]  # Backward compatibility alias for compose
# Audio (ASR) decode + resample. Reuse vLLM's own audio deps (unversioned, so it
# tracks the active vLLM).
audio = ["vllm[audio]"]
tutorials = [
    "granite-switch[hf,vllm,compose]",
    "chromadb>=0.4.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "mellea==0.6.0",
    "ipython>=8.10.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.0.0",
]

[project.entry-points."vllm.general_plugins"]
register_granite_switch = "granite_switch.vllm:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tests/_legacy", "-m", "not deep"]
markers = [
    "gpu: requires CUDA GPU",
    "vllm: requires vLLM installed",
    "slow: takes > 30s",
    "deep: expensive code-theory tests (m=8 / 256-dim); run with: pytest -m deep",
    "requires_model: needs a real model checkpoint",
    "audio: exercises the audio/ASR path; run with: pytest -m audio",
]

[dependency-groups]
# TWO LINES ARE DECLARED AND THEY ARE THE TWO CI LEGS: `dev` pins the floor and
# `dev-latest` the ceiling, which is what /opt/gsw/derive_legs.py reads out of
# the tested commit. The `vllm` extra above claims the whole 0.26-0.32 range; the
# two bounds are where a break actually lands, since a deleted API shows up at
# the ceiling and an API that does not exist yet shows up at the floor.
#
# The intermediate lines have no groups here, and that is deliberate rather than
# an omission. They are not taken on trust either: an upgrade adds a group per
# line temporarily, so that each line can be `dev-latest` at one commit and be
# dispatched at that commit's own sha -- the only way to get per-line evidence
# when derive_legs.py emits at most two legs. Once the evidence exists the group
# has no remaining job, and leaving it would pin a line that nothing resolves and
# nothing tests. So the upgrade prunes them before merging.
#
# Both halves of that are automated by the `upgrade-vllm` skill in the internal
# repo (generative-computing/granite-switch-internal, .claude/skills/upgrade-vllm/):
# `plumb_pyproject.py --add` / `--point-latest` walk the lines, `--prune` removes
# the scaffolding, and `--check --final` refuses a tree where either step was
# skipped. Changing a supported bound means repointing `dev` or `dev-latest`.
# The two version-named groups, and the only ones. They are not CI's: CI asks for
# `dev` and `dev-latest`. These exist because README.md and CONTRIBUTING.md hand
# them to a reader who wants exactly one line pinned, and `vllm26` is what a bare
# `uv sync` resolves through `default-groups` below.
vllm26     = ["vllm>=0.26.0,<0.27.0"]
vllm32     = ["vllm>=0.32.0,<0.33.0"]
# `audio` is included so the audio tests can actually run: the ASR path needs
# vLLM's audio deps (av/soundfile/resampy) at runtime, and no group pulled them
# in before (integration tests failed with ModuleNotFoundError on a synced pod).
dev        = ["pytest", "pytest-cov", { include-group = "vllm26" }, "granite-switch[hf,compose,audio]"]
# The ceiling's dev flavour, and the GPU workflow's upper leg. There is no
# `dev-vllm32` in between: a version-named group whose only consumer was this
# alias made the ceiling a two-step indirection, where repointing one of the two
# and not the other is a silent misconfiguration rather than an error. So the
# only version-named groups left are the two the docs hand to a reader who wants
# one line pinned (README.md, CONTRIBUTING.md), and `dev` / `dev-latest` are the
# only names CI resolves. Now on 0.32, the true ceiling of the `vllm` extra's
# range -- which is also the only state that may merge, since CI's upper leg
# comes from this group and anything lower would leave the top supported line
# untested (`plumb_pyproject.py --check --final` enforces exactly that). During
# the upgrade it was pointed at each added line in turn, one commit each, to
# collect that line's own GPU evidence at its own sha.
dev-latest = ["pytest", "pytest-cov", { include-group = "vllm32" }, "granite-switch[hf,compose,audio]"]
test       = ["pytest", "pytest-cov", "bitsandbytes", "optimum-quanto", { include-group = "dev" }]

[tool.uv]
default-groups = ["vllm26"]
# GENERATED by `plumb_pyproject.py` in the internal repo's upgrade-vllm
# skill (generative-computing/granite-switch-internal). Edit by hand only
# if you also regenerate the whole table -- see the growth note below.
# Only the per-line GROUPS are mutually exclusive. The `vllm` extra spans
# 0.26-0.32, so it overlaps every group and conflicts with none of them --
# an extra pinned to one line while default-groups named another is what made
# `uv sync` unsatisfiable once before.
# Below: every pair of groups that would pull two different vLLM lines into one
# venv. 2 lines are declared (0.26 / 0.32), each with a bare and a
# dev flavour, so the 1 cross-line pair gives 4 entries.
# `test` is absent deliberately: it reaches the floor through
# `include-group = "dev"` and uv derives that transitively.
#
# Only the floor and the ceiling are declared in a merged tree. An upgrade
# run adds one group per new line so each can be `dev-latest` at some
# commit and earn its own GPU evidence, then prunes them again: the entry
# count grows quadratically in the number of lines, and a MISSING pair does
# not fail loudly -- it lets `uv sync` resolve two vLLM wheels into one
# environment.
conflicts = [
    # 0.26 vs 0.32
    [{ group = "vllm26" },     { group = "vllm32" }],
    [{ group = "vllm26" },     { group = "dev-latest" }],
    [{ group = "dev" },        { group = "vllm32" }],
    [{ group = "dev" },        { group = "dev-latest" }],
]

[tool.coverage.run]
source = ["granite_switch"]
# CI's coverage run executes only tests/unit/ (the CPU-safe set — see docs/CICD.md).
# The subpackages below are structurally untestable there: they need a GPU, real model
# checkpoints, or deps CI doesn't install (vLLM/tutorials). Their coverage is measured on
# the GPU cluster, not here. Omitting them keeps the CI coverage number meaningful — it
# reports "of the code the unit suite is responsible for, how much is covered" — instead of
# being diluted to ~1% by thousands of unreachable GPU-only lines.
omit = [
    "*/granite_switch/hf/*",
    "*/granite_switch/vllm/*",
    "*/granite_switch/composer/*",
    "*/granite_switch/tutorials/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF"]
ignore = [
    "E501",   # line length handled by the formatter
    "RUF002", # ambiguous unicode in docstrings — intentional math symbols (×, μ, →)
    "RUF003", # ambiguous unicode in comments — same
    "RUF012", # mutable class defaults — doesn't fit the config/model-class style
    "UP038",  # isinstance(x, (A, B)) → A | B — deprecated upstream, slower at runtime
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files intentionally re-export names; don't strip them as "unused".
"**/__init__.py" = ["F401"]
# Tests/tutorials legitimately import after guards (pytest.skipif, sys.path) or in
# notebook cells (E402), and use short math-style names like `l` (E741).
"tests/**" = ["E402", "E741"]
"tutorials/**" = ["E402", "E741"]
