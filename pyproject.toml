[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-switch"
version = "0.1.1"
description = "Granite Switch: Composable model building"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.11.0",
    "transformers>=5.16,<=5.17.0",
]

[project.urls]
Repository = "https://github.com/generative-computing/granite-switch"
Documentation = "https://github.com/generative-computing/granite-switch/tree/main/tutorials"

[project.optional-dependencies]
hf = ["accelerate>=0.20.0"]
# Every line from 0.26 through 0.32 is supported by one tree; the backend uses
# capability checks rather than version comparisons where the two differ. Prefer
# probing an API's SHAPE over its mere existence: 0.31 reintroduced the
# multimodal `_call_hf_processor` hook that 0.29 had deleted, but with a
# different signature, so `hasattr` alone reads 0.26-0.28 and 0.31+ as the same
# thing (see src/granite_switch/vllm/audio/processor.py).
# Pin a specific line with the per-line dependency groups below.
vllm = ["vllm>=0.26.0,<0.33.0"]
compose = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]
build = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]  # Backward compatibility alias for compose
# Audio (ASR) decode + resample. Reuse vLLM's own audio deps (unversioned, so it
# tracks the active vLLM).
audio = ["vllm[audio]"]
tutorials = [
    "granite-switch[hf,vllm,compose]",
    "chromadb>=0.4.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "mellea==0.6.0",
    "ipython>=8.10.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.0.0",
]

[project.entry-points."vllm.general_plugins"]
register_granite_switch = "granite_switch.vllm:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tests/_legacy", "-m", "not deep"]
markers = [
    "gpu: requires CUDA GPU",
    "vllm: requires vLLM installed",
    "slow: takes > 30s",
    "deep: expensive code-theory tests (m=8 / 256-dim); run with: pytest -m deep",
    "requires_model: needs a real model checkpoint",
    "audio: exercises the audio/ASR path; run with: pytest -m audio",
    "eval: adapter-output eval against a committed baseline; run with: pytest -m eval",
    # Also marked `deep`, so the default `-m "not deep"` hides it: this one RECORDS
    # the baselines the `eval` marker checks against, and must only ever run when
    # asked for by name.
    "eval_record: records eval baselines on the GPU runner; run with: pytest -m eval_record",
]

[dependency-groups]
# vllm26 AND whatever `dev-latest` points at ARE THE TWO CI LEGS -- the ends of
# the supported range, which is why these and not two others. The `vllm` extra
# above claims 0.26-0.32, and the two bounds are where a break actually lands: a
# deleted API shows up at the ceiling and an API that does not exist yet shows up
# at the floor. The intermediate lines sit strictly between two tested lines, so
# per-run they would add install time without adding a failure mode the ends
# would miss -- but they are NOT taken on trust: each added line gets its own
# commit that repoints `dev-latest`, dispatched at that commit's sha, because
# derive_legs.py reads the tested commit and emits at most two legs. See
# .claude/skills/upgrade-vllm/ (Phase 5) for the walk.
vllm26     = ["vllm>=0.26.0,<0.27.0"]
vllm30     = ["vllm>=0.30.0,<0.31.0"]
# vllm27 IS NOT A CI LEG -- it exists so the GPU workflow stays dispatchable
# during this transition. `workflow_dispatch` always executes the workflow file
# from the DEFAULT BRANCH, so until the 0.26/0.30 matrix lands on main, a
# `/gpu-test` run uses main's matrix (legs vllm26 -> dev and vllm27 ->
# dev-vllm27) while checking out the PR's commit. Deleting dev-vllm27 here made
# that leg unresolvable against this tree -- `uv sync --group dev-vllm27` has no
# such group -- and the leg died before pytest started. Keeping the group costs
# nothing and is not a fiction: the `vllm` extra claims 0.26-0.32, so 0.27 is a
# supported line that simply isn't worth its own per-run leg. Removable once the
# matrix rename is on main.
vllm27     = ["vllm>=0.27.0,<0.28.0"]
vllm31     = ["vllm>=0.31.0,<0.32.0"]
vllm32     = ["vllm>=0.32.0,<0.33.0"]
# `audio` is included so the audio tests can actually run: the ASR path needs
# vLLM's audio deps (av/soundfile/resampy) at runtime, and no group pulled them
# in before (integration tests failed with ModuleNotFoundError on a synced pod).
dev        = ["pytest", "pytest-cov", { include-group = "vllm26" }, "granite-switch[hf,compose,audio]"]
dev-vllm27 = ["pytest", "pytest-cov", { include-group = "vllm27" }, "granite-switch[hf,compose,audio]"]
dev-vllm30 = ["pytest", "pytest-cov", { include-group = "vllm30" }, "granite-switch[hf,compose,audio]"]
dev-vllm31 = ["pytest", "pytest-cov", { include-group = "vllm31" }, "granite-switch[hf,compose,audio]"]
dev-vllm32 = ["pytest", "pytest-cov", { include-group = "vllm32" }, "granite-switch[hf,compose,audio]"]
# The newest vLLM line, as an alias. The GPU workflow (derive_legs.py) and
# CLAUDE.md ask for `dev-latest` rather than the concrete `dev-vllmNN`, so moving
# the ceiling is repointing this one line instead of chasing the version through
# every caller. Now on 0.32, the true ceiling of the `vllm` extra's range -- which
# is also the only state that may merge, since CI's upper leg comes from this
# alias and anything lower would leave the top supported line untested
# (`plumb_pyproject.py --check --final` enforces exactly that). The preceding
# commit parked it on 0.31 to collect that line's own GPU evidence at its own sha,
# because derive_legs.py reads the TESTED commit rather than the branch tip; see
# .claude/skills/upgrade-vllm/ Phase 5 for the walk.
dev-latest = [{ include-group = "dev-vllm32" }]
test       = ["pytest", "pytest-cov", "bitsandbytes", "optimum-quanto", { include-group = "dev" }]

[tool.uv]
default-groups = ["vllm26"]
# GENERATED by .claude/skills/upgrade-vllm/scripts/plumb_pyproject.py.
# Only the per-line GROUPS are mutually exclusive. The `vllm` extra spans
# 0.26-0.32, so it overlaps every group and conflicts with none of them --
# an extra pinned to one line while default-groups named another is what made
# `uv sync` unsatisfiable once before.
# Below: every pair of groups that would pull two different vLLM lines into one
# venv. 5 lines are declared (0.26 / 0.27 / 0.30 / 0.31 / 0.32), each with a bare and a
# dev flavour, so the 10 cross-line pairs give 48 entries. The line
# `dev-latest` aliases carries a third name and so appears in more pairs --
# uv matches group names literally, so the alias needs its own entries.
# `test` is absent deliberately: it reaches the floor through
# `include-group = "dev"` and uv derives that transitively.
conflicts = [
    # 0.26 vs 0.27
    [{ group = "vllm26" },     { group = "vllm27" }],
    [{ group = "vllm26" },     { group = "dev-vllm27" }],
    [{ group = "dev" },        { group = "vllm27" }],
    [{ group = "dev" },        { group = "dev-vllm27" }],
    # 0.26 vs 0.30
    [{ group = "vllm26" },     { group = "vllm30" }],
    [{ group = "vllm26" },     { group = "dev-vllm30" }],
    [{ group = "dev" },        { group = "vllm30" }],
    [{ group = "dev" },        { group = "dev-vllm30" }],
    # 0.26 vs 0.31
    [{ group = "vllm26" },     { group = "vllm31" }],
    [{ group = "vllm26" },     { group = "dev-vllm31" }],
    [{ group = "dev" },        { group = "vllm31" }],
    [{ group = "dev" },        { group = "dev-vllm31" }],
    # 0.26 vs 0.32
    [{ group = "vllm26" },     { group = "vllm32" }],
    [{ group = "vllm26" },     { group = "dev-vllm32" }],
    [{ group = "vllm26" },     { group = "dev-latest" }],
    [{ group = "dev" },        { group = "vllm32" }],
    [{ group = "dev" },        { group = "dev-vllm32" }],
    [{ group = "dev" },        { group = "dev-latest" }],
    # 0.27 vs 0.30
    [{ group = "vllm27" },     { group = "vllm30" }],
    [{ group = "vllm27" },     { group = "dev-vllm30" }],
    [{ group = "dev-vllm27" }, { group = "vllm30" }],
    [{ group = "dev-vllm27" }, { group = "dev-vllm30" }],
    # 0.27 vs 0.31
    [{ group = "vllm27" },     { group = "vllm31" }],
    [{ group = "vllm27" },     { group = "dev-vllm31" }],
    [{ group = "dev-vllm27" }, { group = "vllm31" }],
    [{ group = "dev-vllm27" }, { group = "dev-vllm31" }],
    # 0.27 vs 0.32
    [{ group = "vllm27" },     { group = "vllm32" }],
    [{ group = "vllm27" },     { group = "dev-vllm32" }],
    [{ group = "vllm27" },     { group = "dev-latest" }],
    [{ group = "dev-vllm27" }, { group = "vllm32" }],
    [{ group = "dev-vllm27" }, { group = "dev-vllm32" }],
    [{ group = "dev-vllm27" }, { group = "dev-latest" }],
    # 0.30 vs 0.31
    [{ group = "vllm30" },     { group = "vllm31" }],
    [{ group = "vllm30" },     { group = "dev-vllm31" }],
    [{ group = "dev-vllm30" }, { group = "vllm31" }],
    [{ group = "dev-vllm30" }, { group = "dev-vllm31" }],
    # 0.30 vs 0.32
    [{ group = "vllm30" },     { group = "vllm32" }],
    [{ group = "vllm30" },     { group = "dev-vllm32" }],
    [{ group = "vllm30" },     { group = "dev-latest" }],
    [{ group = "dev-vllm30" }, { group = "vllm32" }],
    [{ group = "dev-vllm30" }, { group = "dev-vllm32" }],
    [{ group = "dev-vllm30" }, { group = "dev-latest" }],
    # 0.31 vs 0.32
    [{ group = "vllm31" },     { group = "vllm32" }],
    [{ group = "vllm31" },     { group = "dev-vllm32" }],
    [{ group = "vllm31" },     { group = "dev-latest" }],
    [{ group = "dev-vllm31" }, { group = "vllm32" }],
    [{ group = "dev-vllm31" }, { group = "dev-vllm32" }],
    [{ group = "dev-vllm31" }, { group = "dev-latest" }],
]

[tool.coverage.run]
source = ["granite_switch"]
# CI's coverage run executes only tests/unit/ (the CPU-safe set — see docs/CICD.md).
# The subpackages below are structurally untestable there: they need a GPU, real model
# checkpoints, or deps CI doesn't install (vLLM/tutorials). Their coverage is measured on
# the GPU cluster, not here. Omitting them keeps the CI coverage number meaningful — it
# reports "of the code the unit suite is responsible for, how much is covered" — instead of
# being diluted to ~1% by thousands of unreachable GPU-only lines.
omit = [
    "*/granite_switch/hf/*",
    "*/granite_switch/vllm/*",
    "*/granite_switch/composer/*",
    "*/granite_switch/tutorials/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF"]
ignore = [
    "E501",   # line length handled by the formatter
    "RUF002", # ambiguous unicode in docstrings — intentional math symbols (×, μ, →)
    "RUF003", # ambiguous unicode in comments — same
    "RUF012", # mutable class defaults — doesn't fit the config/model-class style
    "UP038",  # isinstance(x, (A, B)) → A | B — deprecated upstream, slower at runtime
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files intentionally re-export names; don't strip them as "unused".
"**/__init__.py" = ["F401"]
# Tests/tutorials legitimately import after guards (pytest.skipif, sys.path) or in
# notebook cells (E402), and use short math-style names like `l` (E741).
"tests/**" = ["E402", "E741"]
"tutorials/**" = ["E402", "E741"]
