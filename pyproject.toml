[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-switch"
version = "0.1.0"
description = "Granite Switch: Composable model building"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.11.0",
    "transformers>=5.16,<=5.17.0",
]

[project.urls]
Repository = "https://github.com/generative-computing/granite-switch"
Documentation = "https://github.com/generative-computing/granite-switch/tree/main/tutorials"

[project.optional-dependencies]
hf = ["accelerate>=0.20.0"]
vllm = ["vllm>=0.26.0,<0.27.0"]
vllm27 = ["vllm>=0.27.0,<0.28.0"]
compose = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]
build = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]  # Backward compatibility alias for compose
# Audio (ASR) decode + resample. Reuse vLLM's own audio deps (unversioned, so it
# tracks the active vLLM).
audio = ["vllm[audio]"]
tutorials = [
    "granite-switch[hf,vllm,compose]",
    "chromadb>=0.4.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "mellea==0.6.0",
    "ipython>=8.10.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.0.0",
]

[project.entry-points."vllm.general_plugins"]
register_granite_switch = "granite_switch.vllm:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tests/_legacy", "-m", "not deep"]
markers = [
    "gpu: requires CUDA GPU",
    "vllm: requires vLLM installed",
    "slow: takes > 30s",
    "deep: expensive code-theory tests (m=8 / 256-dim); run with: pytest -m deep",
    "requires_model: needs a real model checkpoint",
    "audio: exercises the audio/ASR path; run with: pytest -m audio",
]

[dependency-groups]
vllm26     = ["vllm>=0.26.0,<0.27.0"]
vllm27     = ["vllm>=0.27.0,<0.28.0"]
# NO DEV GROUP MAY BE NAMED A BARE `dev`. The GPU cluster harness looks the
# `--dep-group` name up in a table of its own that pairs each name with a job tag
# and the vLLM line it then ASSERTS the pod installed. Observed from run logs:
#
#     dep group: dev          (job tag v19,         expect vllm 0.19.x)
#     dep group: dev-vllm20   (job tag v20,         expect vllm 0.20.x)
#     dep group: dev-vllm27   (job tag dev-vllm27,  expect vllm any.x)
#
# Note the third line: an UNKNOWN name is not an error -- it falls back to
# `tag = the name itself, expect any.x`, i.e. no assertion at all. Only names the
# table knows carry a version claim, and `dev`'s claim was frozen at 0.19.x.
#
# So once #130 moved `dev` onto the 0.26 line, the leg installed 0.26 correctly and
# then died on that stale entry, before pytest ever started:
#
#     torch 2.11.0+cu130 vllm 0.26.0
#     FATAL expected vllm 0.19.x for group dev but got 0.26.0
#
# while `dev-vllm27`, absent from the table, sailed through on `any.x`. Renaming to
# `dev-vllm26` therefore fixes the leg unconditionally -- it stops addressing the
# one stale entry and lands on the no-assertion fallback. It does NOT depend on the
# harness parsing "26" out of the name; it cannot, as the table is explicit.
#
# TRADE-OFF, AND THE REAL FOLLOW-UP: `any.x` means no leg asserts its vLLM line any
# more, so a venv that silently resolved the wrong line would no longer be caught
# here. The fix is for the harness table to gain real `dev-vllm26/27/30` entries;
# until it does, the per-line `vllm26`/`vllm27` bounds below are what pin the line.
#
# This is a rename, not a new group: `dev` is gone rather than aliased, so the name
# carrying the stale 0.19.x claim cannot be passed by accident. Adding a parallel
# `dev-vllm26` and keeping `dev` was tried and rejected -- an extra conflicting
# group multiplies uv's resolution-marker space (+3093 net lines of uv.lock for an
# identical 275-package resolution), whereas the rename is diff-balanced.
#
# `audio` is included so the audio tests can actually run: the ASR path needs
# vLLM's audio deps (av/soundfile/resampy) at runtime, and no group pulled them
# in before (integration tests failed with ModuleNotFoundError on a synced pod).
dev-vllm26 = ["pytest", "pytest-cov", { include-group = "vllm26" }, "granite-switch[hf,compose,audio]"]
dev-vllm27 = ["pytest", "pytest-cov", { include-group = "vllm27" }, "granite-switch[hf,compose,audio]"]
test       = ["pytest", "pytest-cov", "bitsandbytes", "optimum-quanto", { include-group = "dev-vllm26" }]

[tool.uv]
default-groups = ["vllm26"]
conflicts = [
    # group-vs-group
    [{ group = "vllm26" },     { group = "vllm27" }],
    [{ group = "dev-vllm26" }, { group = "vllm27" }],
    [{ group = "dev-vllm26" }, { group = "dev-vllm27" }],
    [{ group = "dev-vllm27" }, { group = "vllm26" }],
    # group-vs-extra
    [{ group = "vllm26" },     { extra = "vllm27" }],
    [{ group = "vllm27" },     { extra = "vllm" }],
    [{ group = "vllm27" },     { extra = "tutorials" }],
    [{ group = "dev-vllm26" }, { extra = "vllm27" }],
    [{ group = "dev-vllm27" }, { extra = "vllm" }],
    [{ group = "dev-vllm27" }, { extra = "tutorials" }],
    # extra-vs-extra
    [{ extra = "vllm" },       { extra = "vllm27" }],
    [{ extra = "tutorials" },  { extra = "vllm27" }],
]

[tool.coverage.run]
source = ["granite_switch"]
# CI's coverage run executes only tests/unit/ (the CPU-safe set — see docs/CICD.md).
# The subpackages below are structurally untestable there: they need a GPU, real model
# checkpoints, or deps CI doesn't install (vLLM/tutorials). Their coverage is measured on
# the GPU cluster, not here. Omitting them keeps the CI coverage number meaningful — it
# reports "of the code the unit suite is responsible for, how much is covered" — instead of
# being diluted to ~1% by thousands of unreachable GPU-only lines.
omit = [
    "*/granite_switch/hf/*",
    "*/granite_switch/vllm/*",
    "*/granite_switch/composer/*",
    "*/granite_switch/tutorials/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF"]
ignore = [
    "E501",   # line length handled by the formatter
    "RUF002", # ambiguous unicode in docstrings — intentional math symbols (×, μ, →)
    "RUF003", # ambiguous unicode in comments — same
    "RUF012", # mutable class defaults — doesn't fit the config/model-class style
    "UP038",  # isinstance(x, (A, B)) → A | B — deprecated upstream, slower at runtime
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files intentionally re-export names; don't strip them as "unused".
"**/__init__.py" = ["F401"]
# Tests/tutorials legitimately import after guards (pytest.skipif, sys.path) or in
# notebook cells (E402), and use short math-style names like `l` (E741).
"tests/**" = ["E402", "E741"]
"tutorials/**" = ["E402", "E741"]
