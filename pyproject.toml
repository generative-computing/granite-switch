[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-switch"
version = "0.1.0"
description = "Granite Switch: Composable model building"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.11.0",
    "transformers>=5.16,<=5.17.0",
]

[project.urls]
Repository = "https://github.com/generative-computing/granite-switch"
Documentation = "https://github.com/generative-computing/granite-switch/tree/main/tutorials"

[project.optional-dependencies]
hf = ["accelerate>=0.20.0"]
# Every line from 0.26 through 0.30 is supported by one tree; the backend uses
# capability checks (hasattr) rather than version comparisons where the two
# differ. Pin a specific line with the per-line dependency groups below.
vllm = ["vllm>=0.26.0,<0.31.0"]
compose = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]
build = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]  # Backward compatibility alias for compose
# Audio (ASR) decode + resample. Reuse vLLM's own audio deps (unversioned, so it
# tracks the active vLLM).
audio = ["vllm[audio]"]
tutorials = [
    "granite-switch[hf,vllm,compose]",
    "chromadb>=0.4.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "mellea==0.6.0",
    "ipython>=8.10.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.0.0",
]

[project.entry-points."vllm.general_plugins"]
register_granite_switch = "granite_switch.vllm:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tests/_legacy", "-m", "not deep"]
markers = [
    "gpu: requires CUDA GPU",
    "vllm: requires vLLM installed",
    "slow: takes > 30s",
    "deep: expensive code-theory tests (m=8 / 256-dim); run with: pytest -m deep",
    "requires_model: needs a real model checkpoint",
    "audio: exercises the audio/ASR path; run with: pytest -m audio",
]

[dependency-groups]
# THE TWO ENDS OF THE SUPPORTED RANGE, which is why these two and not two others.
# The `vllm` extra above claims 0.26-0.30, and the two bounds are where a break
# actually lands: a deleted API shows up at the ceiling and an API that does not
# exist yet shows up at the floor. 0.27/0.28/0.29 sit strictly between two tested
# lines, so they add install time without adding a failure mode the ends would miss.
# All five lines were verified together out of band (five-leg GPU matrix, every
# suite green); these groups are what CI re-checks on every run.
vllm26     = ["vllm>=0.26.0,<0.27.0"]
vllm30     = ["vllm>=0.30.0,<0.31.0"]
# `audio` is included so the audio tests can actually run: the ASR path needs
# vLLM's audio deps (av/soundfile/resampy) at runtime, and no group pulled them
# in before (integration tests failed with ModuleNotFoundError on a synced pod).
dev        = ["pytest", "pytest-cov", { include-group = "vllm26" }, "granite-switch[hf,compose,audio]"]
dev-vllm30 = ["pytest", "pytest-cov", { include-group = "vllm30" }, "granite-switch[hf,compose,audio]"]
test       = ["pytest", "pytest-cov", "bitsandbytes", "optimum-quanto", { include-group = "dev" }]

[tool.uv]
default-groups = ["vllm26"]
# Only the per-line GROUPS are mutually exclusive now. The `vllm` extra spans
# 0.26-0.30, so it overlaps every group and no longer conflicts with any of them --
# which is what made `uv sync` unsatisfiable while the extra said 0.30-only and the
# default group said 0.26.
conflicts = [
    [{ group = "vllm26" },     { group = "vllm30" }],
    [{ group = "dev" },        { group = "vllm30" }],
    [{ group = "dev" },        { group = "dev-vllm30" }],
    [{ group = "dev-vllm30" }, { group = "vllm26" }],
]

[tool.coverage.run]
source = ["granite_switch"]
# CI's coverage run executes only tests/unit/ (the CPU-safe set — see docs/CICD.md).
# The subpackages below are structurally untestable there: they need a GPU, real model
# checkpoints, or deps CI doesn't install (vLLM/tutorials). Their coverage is measured on
# the GPU cluster, not here. Omitting them keeps the CI coverage number meaningful — it
# reports "of the code the unit suite is responsible for, how much is covered" — instead of
# being diluted to ~1% by thousands of unreachable GPU-only lines.
omit = [
    "*/granite_switch/hf/*",
    "*/granite_switch/vllm/*",
    "*/granite_switch/composer/*",
    "*/granite_switch/tutorials/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF"]
ignore = [
    "E501",   # line length handled by the formatter
    "RUF002", # ambiguous unicode in docstrings — intentional math symbols (×, μ, →)
    "RUF003", # ambiguous unicode in comments — same
    "RUF012", # mutable class defaults — doesn't fit the config/model-class style
    "UP038",  # isinstance(x, (A, B)) → A | B — deprecated upstream, slower at runtime
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files intentionally re-export names; don't strip them as "unused".
"**/__init__.py" = ["F401"]
# Tests/tutorials legitimately import after guards (pytest.skipif, sys.path) or in
# notebook cells (E402), and use short math-style names like `l` (E741).
"tests/**" = ["E402", "E741"]
"tutorials/**" = ["E402", "E741"]
