[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-switch"
version = "0.1.0"
description = "Granite Switch: Composable model building"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.10.0",
    "transformers>=5.5.1,<5.10.0",
]

[project.urls]
Repository = "https://github.com/generative-computing/granite-switch"
Documentation = "https://github.com/generative-computing/granite-switch/tree/main/tutorials"

[project.optional-dependencies]
hf = ["accelerate>=0.20.0"]
vllm = ["vllm>=0.19.1,<0.20.0"]
vllm20 = ["vllm>=0.20.0,<0.21.0"]
compose = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]
build = ["huggingface_hub", "pyyaml", "tqdm", "safetensors"]  # Backward compatibility alias for compose
tutorials = [
    "granite-switch[hf,vllm,compose]",
    "chromadb>=0.4.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "mellea==0.6.0",
    "ipython>=8.10.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.0.0",
]

[project.entry-points."vllm.general_plugins"]
register_granite_switch = "granite_switch.vllm:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tests/_legacy", "-m", "not deep"]
markers = [
    "gpu: requires CUDA GPU",
    "vllm: requires vLLM installed",
    "slow: takes > 30s",
    "deep: expensive code-theory tests (m=8 / 256-dim); run with: pytest -m deep",
    "requires_model: needs a real model checkpoint",
]

[dependency-groups]
vllm19     = ["vllm>=0.19.1,<0.20.0"]
vllm20     = ["vllm>=0.20.0,<0.21.0"]
dev        = ["pytest", { include-group = "vllm19" }, "granite-switch[hf,compose]"]
dev-vllm20 = ["pytest", { include-group = "vllm20" }, "granite-switch[hf,compose]"]
test       = ["pytest", "bitsandbytes", "optimum-quanto", { include-group = "dev" }]

[tool.uv]
default-groups = ["vllm19"]
conflicts = [
    # group-vs-group
    [{ group = "vllm19" },     { group = "vllm20" }],
    [{ group = "dev" },        { group = "vllm20" }],
    [{ group = "dev" },        { group = "dev-vllm20" }],
    [{ group = "dev-vllm20" }, { group = "vllm19" }],
    # group-vs-extra
    [{ group = "vllm19" },     { extra = "vllm20" }],
    [{ group = "vllm20" },     { extra = "vllm" }],
    [{ group = "vllm20" },     { extra = "tutorials" }],
    [{ group = "dev" },        { extra = "vllm20" }],
    [{ group = "dev-vllm20" }, { extra = "vllm" }],
    [{ group = "dev-vllm20" }, { extra = "tutorials" }],
    # extra-vs-extra
    [{ extra = "vllm" },       { extra = "vllm20" }],
    [{ extra = "tutorials" },  { extra = "vllm20" }],
]

[tool.setuptools.packages.find]
where = ["src"]
