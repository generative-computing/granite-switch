# SPDX-License-Identifier: Apache-2.0
#
# Adapter accuracy benchmark definition.
#
# Every (model, intrinsic, technology) triple is one results cell. A cell is
# run when its staged checkpoint exists under the model's bench root:
#
#   <bench_root>/adapters/<intrinsic id>/<technology id>/
#       adapter_config.json, adapter_model.safetensors, provenance.json
#   <bench_root>/eval/<intrinsic id>/evaluation.jsonl
#
# and is shown as skipped otherwise. To add an intrinsic: add an entry here,
# a scorer under scorers/ if none fits, and stage its folders.
#
# Bump a model's bench_version when a change here or in the harness would
# change its numbers (eval set, generation settings, adapter checkpoints).
# Rows with an older version stay on the page but are not cache hits. A change
# for every model bumps each of them.
#
# A change to how one intrinsic is scored bumps only its score_version
# (default 1): every run kept its answers, so `submit.sh rescore` scores them
# again without generating.
#
# The reference columns run the same checkpoints without granite-switch (HF +
# PEFT), plus the base model with no adapter. They do not depend on the
# commit, so they are computed once per model (`submit.sh reference`) and shown
# on every row of its current bench_version. Bump reference_version when a change
# alters only them: the pinned library versions, the SR model code, or the
# reference generation (hf_generate.py). A bench_version bump also
# invalidates them.
#
# reference_version 2: the base model is told the output format its scorer
# expects, in a final user turn (private instructions, see prompts.py).

reference_version: 2

# One entry per base model, each with its own bench root (staged adapters and
# eval sets), bench_version and tab on the page. The first is the default of
# every command's --model.
models:
  # bench_version 2: an answerability label counts without its quotes too
  # (scorers/answerability.py).
  - id: granite-4.1-3b
    name: ibm-granite/granite-4.1-3b
    label: Granite 4.1 3B
    bench_version: 2
  - id: granite-4.2-3b
    name: ibm-research/granite-4.2-3b-prerelease-r260622a
    label: Granite 4.2 3B (prerelease)
    # v3: the LoRA and aLoRA adapters trained on 4.1's data with its documents
    # in the system turn (the answerability aLoRA replaced), and the base model
    # prompted the same way.
    bench_version: 3
    # Its chat template has no documents= and reasons unless told not to. Its
    # checkpoints were trained with reasoning off: LoRA and aLoRA on 4.1's data
    # with the documents in the system turn, as 4.1's template put them; SR,
    # by its own trainer, with the documents in a tool message (prompts.py).
    # The base model gets the system form.
    prompt:
      chat_template_kwargs: {enable_thinking: false}
      documents: system
      documents_by_technology: {sr: tool_json_after_question}
  # Its Hugging Face release only, for now: no adapter is staged for it.
  - id: granite-4.1-8b
    name: ibm-granite/granite-4.1-8b
    label: Granite 4.1 8B
    bench_version: 1
    # An 8B base keeps twice the 3B's K/V per token: half the token budget.
    reference: {token_budget: 131072}
  # Its Hugging Face release only, for now: no adapter is staged for it. Its
  # 60 GB of bf16 weights leave one 80 GB GPU too little room for the speed
  # tests' contexts, so each of its vLLM engines spreads over two GPUs.
  - id: granite-4.1-30b
    name: ibm-granite/granite-4.1-30b
    label: Granite 4.1 30B
    bench_version: 1
    tensor_parallel_size: 2
    resources: {bench: {gpus: 2, cpus: 32, memory: 256Gi}}
    # A 30B base keeps 1.6 times the 8B's K/V per token and its weights fill
    # three quarters of a GPU: a quarter of the 8B's token budget, and its four
    # copies (a cell per GPU) loaded one at a time.
    reference: {token_budget: 32768, serial_loads: true}

# Composed checkpoints published on the Hugging Face Hub, benchmarked as
# published (release.py; docs/ADAPTER_BENCHMARK.md, "Hugging Face releases"):
# a table of their own under their model's, a row per release, named by its Hub
# revision. Each runs on its model's eval sets, its adapters against the same
# library checkpoints under HF + PEFT. A new release is a new entry; a later Hub
# commit that changes only the model card needs nothing. Each is served by a
# granite-switch commit (serve_with) or by a granite-switch version from PyPI
# (serve_pypi). A release composed from the same adapter files on the same base
# as an earlier one shows that one's reference columns (reference_from) instead
# of running them again. Bump release_version when a change alters how releases
# are benchmarked: every one runs again.
release_version: 1
releases:
  - model: granite-4.1-3b
    repo: ibm-granite/granite-switch-4.1-3b-preview
    revision: 7a3ac02e07868411424ac89440397b475da66fa7
    # The base model's latest revision when the release was composed.
    base_revision: c0650403e44e78ec0262dab1c90914c65b196c4e
    # Composed for the single-switch engine, which 6013c7ff (#131) removed: its
    # parent is the last commit that loads the checkpoint.
    serve_with: 24aa420f71b6703f96e40533d83041ce311c30ae
    # The libraries of its adapters, at the revisions its BUILD.md records.
    sources:
      ibm-granite/granitelib-rag-r1.0: 2f0b2c79c6731068625aca8045c2eb2e8912b353
      ibm-granite/granitelib-core-r1.0: d0a2a96a4cd07e96f0fe7ca29a42bfe088299d43
      ibm-granite/granitelib-guardian-r1.0: 773b254e98f993a605ec4b6259634906e0e64e8e
    # Its name for each of the benchmark's intrinsics.
    adapters:
      answerability: answerability
      query_clarification: query_clarification
      guardian_core: guardian-core
      requirement_check: requirement-check
  - model: granite-4.1-8b
    repo: ibm-granite/granite-switch-4.1-8b-preview
    revision: c739556e0b2c66f21e5108dc4036f52e1893e256
    base_revision: 1504002f650e656a0a3789d99574df12e3e94ed0
    # The same single-switch format, the same libraries and adapter names.
    serve_with: 24aa420f71b6703f96e40533d83041ce311c30ae
    sources:
      ibm-granite/granitelib-rag-r1.0: 2f0b2c79c6731068625aca8045c2eb2e8912b353
      ibm-granite/granitelib-core-r1.0: d0a2a96a4cd07e96f0fe7ca29a42bfe088299d43
      ibm-granite/granitelib-guardian-r1.0: 773b254e98f993a605ec4b6259634906e0e64e8e
    adapters:
      answerability: answerability
      query_clarification: query_clarification
      guardian_core: guardian-core
      requirement_check: requirement-check
  # The 8B preview recomposed on 2026-10-15 for the current engine, with audio
  # input through ASR; its text path is the earlier one's, and it runs the same
  # way. The same 12 adapters and names, from its libraries' newer revisions.
  - model: granite-4.1-8b
    repo: ibm-granite/granite-switch-4.1-8b-preview
    revision: 8a22410af7cbbfa2cbbd39a3af281ba98c2df846
    base_revision: 1504002f650e656a0a3789d99574df12e3e94ed0
    # Served by granite-switch from PyPI, as its users install it.
    serve_pypi: "0.1.1"
    # Its HF + PEFT and Base columns are the earlier 8B release's. The base is
    # at the same revision, and at the libraries' newer revisions each of its
    # 8B adapters has the same weights and config. Only model cards changed, and
    # one io.yaml (requirement-check's aLoRA), which the reference never reads.
    reference_from: c739556e0b2c66f21e5108dc4036f52e1893e256
    sources:
      ibm-granite/granitelib-rag-r1.0: 167c451abc01c140c1059ed88d4bb39db9533ae9
      ibm-granite/granitelib-core-r1.0: 9771650e7d3a1c5d3cc54e2a1b5026aa108531ec
      ibm-granite/granitelib-guardian-r1.0: 1a1a488a51d0d5307e30e5b3c1e66b4a5237d18a
    adapters:
      answerability: answerability
      query_clarification: query_clarification
      guardian_core: guardian-core
      requirement_check: requirement-check
  # The 30B preview, published on 2026-05-24 with the 3B and 8B ones: the same
  # single-switch format, libraries and adapter names, so the same serving
  # commit. Its base's latest revision then is still its latest.
  - model: granite-4.1-30b
    repo: ibm-granite/granite-switch-4.1-30b-preview
    revision: b2d1c82bbd5913f8a07e35c911b402783d1423e1
    base_revision: 4fae6278f7132abf5e971f9de49ebbad09c54cce
    serve_with: 24aa420f71b6703f96e40533d83041ce311c30ae
    sources:
      ibm-granite/granitelib-rag-r1.0: 2f0b2c79c6731068625aca8045c2eb2e8912b353
      ibm-granite/granitelib-core-r1.0: d0a2a96a4cd07e96f0fe7ca29a42bfe088299d43
      ibm-granite/granitelib-guardian-r1.0: 773b254e98f993a605ec4b6259634906e0e64e8e
    adapters:
      answerability: answerability
      query_clarification: query_clarification
      guardian_core: guardian-core
      requirement_check: requirement-check

technologies:
  - id: lora
    label: LoRA
    source: "LoRA (all-linear, r=16)"
  - id: alora
    label: aLoRA
    source: "aLoRA (all-linear, r=32)"
  - id: sr
    label: SR
    source: "Shadow Residual (q,o + MLP, r=32, cross r=32, shared KV)"

# Decode throughput, the Throughput columns: per technology, granite-switch
# against stock vLLM serving the same adapters (native-lora), measured by the
# switch benchmark's own driver (benchmarks/bench_switch_repro.py, copied from
# the staging repository's feature/switch-benchmark branch), its batch-decode
# cell at one batch: `batch` one-token prompts, each request on one of the
# technology's adapters, exactly `generated_tokens` new tokens each, the median
# of `timed_runs` after `warmup_runs`, the two engines one after the other on
# the commit's GPU. A row measured with another batch or length counts as not
# measured, so changing these measures every commit again.
throughput:
  batch: 32
  generated_tokens: 128
  warmup_runs: 2
  timed_runs: 5

# Agents switching adapters, the second Throughput block, measured by the
# switch benchmark's own scripts (benchmarks/gen_switching_grid.py,
# bench_switching_grid.py, bench_agent_sim.py), one cell of its
# grid_concurrency figure: `concurrency` agents released together, each
# generating `decode_tokens` and switching adapter every `span` tokens, with
# tool calls at its rate, on `adapters` synthetic adapters of rank `rank`
# (make_synth_fleet.py), at least `min_agents` agents in waves. The cell is
# the p95 time to complete, after `warmup_runs` untimed runs of it in the same
# engine: that figure's sweep runs 49 cells per engine, so all but its first
# find the adapters loaded and the kernels compiled. Rows measured with other
# settings count as not measured.
switching:
  concurrency: 8
  decode_tokens: 512
  span: 32
  adapters: 64
  rank: 32
  min_agents: 16
  warmup_runs: 1

# max_new_tokens comes from each intrinsic's training config.
# headline is the metric the results page shows; it matches the internal
# results page so numbers can be compared.
#
# Hallucination detection is left out: its scorer skips outputs it cannot
# parse, so a model that rarely produces its format (the base model) is scored
# on a handful of rows. Its scorer is kept for when that changes.
#
# Query rewrite is left out too: an LLM judge grades it and leaves 12-17% of
# rows ungraded, a different set each run, so the same answers score 1-3
# points apart between runs, more than the changes between commits the page
# is meant to show. Its scorer and judge settings are kept for a steadier
# judge. Its entry was:
#   - id: query_rewrite
#     name: Query rewrite
#     scorer: query_rewrite
#     headline: accuracy_over_valid
#     headline_label: Judge accuracy
#     max_new_tokens: 120
intrinsics:
  - id: answerability
    name: Answerability
    scorer: answerability
    headline: accuracy
    headline_label: Accuracy
    max_new_tokens: 200
  - id: query_clarification
    name: Query clarification
    scorer: query_clarification
    headline: overall_accuracy
    headline_label: Accuracy
    max_new_tokens: 160
  - id: guardian_core
    name: Guardian-core
    scorer: guardian
    headline: accuracy
    headline_label: Accuracy
    max_new_tokens: 24
  - id: requirement_check
    name: Requirement check
    scorer: requirements
    headline: balanced_accuracy
    headline_label: Balanced accuracy
    max_new_tokens: 200
