#
# Adapter accuracy benchmark definition.
#
# Every (model, intrinsic, technology) triple is one results cell. A cell is
# run when its staged checkpoint exists under the model's bench root:
#
#   <bench_root>/adapters/<intrinsic id>/<technology id>/
#       adapter_config.json, adapter_model.safetensors, provenance.json
#   <bench_root>/eval/<intrinsic id>/evaluation.jsonl
#
# and is shown as skipped otherwise. To add an intrinsic: add an entry here,
# a scorer under scorers/ if none fits, and stage its folders.
#
# Bump a model's bench_version when a change here or in the harness would
# change its numbers (eval set, generation settings, adapter checkpoints).
# Rows with an older version stay on the page but are not cache hits. A change
# for every model bumps each of them.
#
# A change to how one intrinsic is scored bumps only its score_version
# (default 1): every run kept its answers, so `submit.sh rescore` scores them
# again without generating.
#
# The reference columns run the same checkpoints without granite-switch (HF +
# PEFT), plus the base model with no adapter. They do not depend on the
# commit, so they are computed once per model (`submit.sh reference`) and shown
# on every row of its current bench_version. Bump reference_version when a change
# alters only them: the pinned library versions, the SR model code, or the
# reference generation (hf_generate.py). A bench_version bump also
# invalidates them.
#
# reference_version 2: the base model is told the output format its scorer
# expects, in a final user turn (private instructions, see prompts.py).

reference_version: 2

# One entry per base model, each with its own bench root (staged adapters and
# eval sets), bench_version and tab on the page. The first is the default of
# every command's --model.
models:
  # bench_version 2: an answerability label counts without its quotes too
  # (scorers/answerability.py).
  - id: granite-4.1-3b
    name: ibm-granite/granite-4.1-3b
    label: Granite 4.1 3B
    bench_version: 2
  - id: granite-4.2-3b
    name: ibm-research/granite-4.2-3b-prerelease-r260622a
    label: Granite 4.2 3B (prerelease)
    bench_version: 2
    # Its chat template ignores documents= and reasons unless told not to. Its
    # checkpoints were trained with reasoning off and the documents in tool
    # messages, placed differently by its SR and aLoRA trainers (prompts.py).
    # The base model gets the SR form.
    prompt:
      chat_template_kwargs: {enable_thinking: false}
      documents: tool_json_after_question
      documents_by_technology: {alora: tool_text_before_question}

technologies:
  - id: lora
    label: LoRA
    source: "LoRA (all-linear, r=16)"
  - id: alora
    label: aLoRA
    source: "aLoRA (all-linear, r=32)"
  - id: sr
    label: SR
    source: "Shadow Residual (q,o + MLP, r=32, cross r=32, shared KV)"

# Decode throughput, the Throughput columns: per technology, granite-switch
# against stock vLLM serving the same adapters (native-lora), measured by the
# switch benchmark's own driver (benchmarks/bench_switch_repro.py, copied from
# the staging repository's feature/switch-benchmark branch), its batch-decode
# cell at one batch: `batch` one-token prompts, each request on one of the
# technology's adapters, exactly `generated_tokens` new tokens each, the median
# of `timed_runs` after `warmup_runs`, the two engines one after the other on
# the commit's GPU. A row measured with another batch or length counts as not
# measured, so changing these measures every commit again.
throughput:
  batch: 32
  generated_tokens: 128
  warmup_runs: 2
  timed_runs: 5

# Agents switching adapters, the second Throughput block, measured by the
# switch benchmark's own scripts (benchmarks/gen_switching_grid.py,
# bench_switching_grid.py, bench_agent_sim.py), one cell of its
# grid_concurrency figure: `concurrency` agents released together, each
# generating `decode_tokens` and switching adapter every `span` tokens, with
# tool calls at its rate, on `adapters` synthetic adapters of rank `rank`
# (make_synth_fleet.py), at least `min_agents` agents in waves. The cell is
# the p95 time to complete, after `warmup_runs` untimed runs of it in the same
# engine: that figure's sweep runs 49 cells per engine, so all but its first
# find the adapters loaded and the kernels compiled. Rows measured with other
# settings count as not measured.
switching:
  concurrency: 8
  decode_tokens: 512
  span: 32
  adapters: 64
  rank: 32
  min_agents: 16
  warmup_runs: 1

# max_new_tokens comes from each intrinsic's training config.
# headline is the metric the results page shows; it matches the internal
# results page so numbers can be compared.
#
# Hallucination detection is left out: its scorer skips outputs it cannot
# parse, so a model that rarely produces its format (the base model) is scored
# on a handful of rows. Its scorer is kept for when that changes.
#
# Query rewrite is left out too: an LLM judge grades it and leaves 12-17% of
# rows ungraded, a different set each run, so the same answers score 1-3
# points apart between runs, more than the changes between commits the page
# is meant to show. Its scorer and judge settings are kept for a steadier
# judge. Its entry was:
#   - id: query_rewrite
#     name: Query rewrite
#     scorer: query_rewrite
#     headline: accuracy_over_valid
#     headline_label: Judge accuracy
#     max_new_tokens: 120
intrinsics:
  - id: answerability
    name: Answerability
    scorer: answerability
    headline: accuracy
    headline_label: Accuracy
    max_new_tokens: 200
  - id: query_clarification
    name: Query clarification
    scorer: query_clarification
    headline: overall_accuracy
    headline_label: Accuracy
    max_new_tokens: 160
  - id: guardian_core
    name: Guardian-core
    scorer: guardian
    headline: accuracy
    headline_label: Accuracy
    max_new_tokens: 24
  - id: requirement_check
    name: Requirement check
    scorer: requirements
    headline: balanced_accuracy
    headline_label: Balanced accuracy
    max_new_tokens: 200
