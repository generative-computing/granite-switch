<g><title>round trip: 2–10 ms between the agent and the server, before the next request</title><rect x="342" y="156" width="8" height="24" rx="2" fill="#80deea"/></g>
<g><title>prefill: the whole context so far, computed again (vLLM caches it per adapter)</title><rect x="352" y="156" width="100" height="24" rx="2" fill="#ef5350"/><text x="402" y="172" class="d-chip" text-anchor="middle">prefill again</text></g>
<g><title>decode 32 tokens on adapter ad34</title><rect x="454" y="156" width="48" height="24" rx="2" fill="#4fc3f7"/><text x="478" y="172" class="d-chip" text-anchor="middle">ad34</text></g>
<g><title>round trip: 2–10 ms between the agent and the server, before the next request</title><rect x="504" y="156" width="8" height="24" rx="2" fill="#80deea"/></g>
<g><title>prefill: the whole context so far, computed again (vLLM caches it per adapter)</title><rect x="514" y="156" width="100" height="24" rx="2" fill="#ef5350"/><text x="564" y="172" class="d-chip" text-anchor="middle">prefill again</text></g>
<g><title>decode 32 tokens on adapter ad14</title><rect x="616" y="156" width="48" height="24" rx="2" fill="#4fc3f7"/><text x="640" y="172" class="d-chip" text-anchor="middle">ad14</text></g>
<g><title>round trip: 2–10 ms between the agent and the server, before the next request</title><rect x="666" y="156" width="8" height="24" rx="2" fill="#80deea"/></g>
<g><title>prefill: the whole context so far, computed again (vLLM caches it per adapter)</title><rect x="676" y="156" width="100" height="24" rx="2" fill="#ef5350"/><text x="726" y="172" class="d-chip" text-anchor="middle">prefill again</text></g>
<g><title>decode 32 tokens on adapter ad24</title><rect x="778" y="156" width="48" height="24" rx="2" fill="#4fc3f7"/><text x="802" y="172" class="d-chip" text-anchor="middle">ad24</text></g>
<g><title>round trip: 2–10 ms between the agent and the server, before the next request</title><rect x="828" y="156" width="8" height="24" rx="2" fill="#80deea"/></g>
<g><title>prefill: the whole context so far, computed again (vLLM caches it per adapter)</title><rect x="838" y="156" width="100" height="24" rx="2" fill="#ef5350"/><text x="888" y="172" class="d-chip" text-anchor="middle">prefill again</text></g>
<g><title>decode 32 tokens on adapter ad4</title><rect x="940" y="156" width="48" height="24" rx="2" fill="#4fc3f7"/><text x="964" y="172" class="d-chip" text-anchor="middle">ad4</text></g>
<text x="996" y="172" class="d-sub">…</text>
<text x="130" y="196" class="d-note">A new request per adapter: each one prefills the whole context again (vLLM caches it per adapter).</text>
<text x="0" y="221" class="d-lane">gs-sr-vllm</text>
<text x="0" y="237" class="d-sub">granite-switch SR</text>
<g><title>decode 32 tokens on adapter ad25</title><rect x="130" y="212" width="48" height="24" rx="2" fill="#4fc3f7"/><text x="154" y="228" class="d-chip" text-anchor="middle">ad25</text></g>
