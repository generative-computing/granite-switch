<g><title>done</title><rect x="944" y="212" width="60" height="24" rx="2" fill="none" stroke="#66bb6a" stroke-width="1.5"/><text x="974" y="228" class="d-lab" text-anchor="middle">done</text></g>
<text x="130" y="252" class="d-note">One request until a tool call: its K/V come from the base model, so the adapter* changes in place.</text>
<text x="1018" y="252" class="d-sub" text-anchor="end">time →</text>
<text x="0" y="276" class="d-note">* Shown switching as often as LoRA. SR's switch isn't implemented yet, so the run kept one adapter; on the GPU, SR costs the same either way.</text>
</svg>
