<svg viewBox="-16 -16 1056 316" width="1056" height="316" role="img" aria-labelledby="dTitle dDesc" xmlns="http://www.w3.org/2000/svg">
<title id="dTitle">The simulated agent, and what each lane does at an adapter switch</title>
<desc id="dDesc">Each agent prefills its own prompt, then thinks in 32-token steps, switching adapter at each, calls a tool after every 256 tokens, and is done after its tokens. At each switch, stock vLLM ends the request, waits a round trip and prefills the whole context again; granite-switch SR keeps one request running until a tool call.</desc>
<defs><marker id="dArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
<style>
  text { font-family: 'IBM Plex Mono', Consolas, 'Cascadia Code', Monaco, monospace; }
  .d-h    { fill: #9a9a9a; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
  .d-step { fill: #bdbdbd; font-size: 11px; font-weight: 600; }
  .d-lane { fill: #9cdcfe; font-size: 12px; font-weight: 600; }
  .d-chip { fill: #1e1e1e; font-size: 10px; }
  .d-lab  { fill: #cccccc; font-size: 11px; }
  .d-sub  { fill: #8a8a8a; font-size: 10.5px; }
  .d-note { fill: #8a8a8a; font-size: 11px; }
  .d-arrow, .d-rule { stroke: #666; stroke-width: 1; fill: none; }
</style>
<rect x="-16" y="-16" width="1056" height="316" fill="#1e1e1e"/>
<text x="0" y="11" class="d-h">EACH AGENT · A REACT LOOP, THE SAME IN BOTH LANES</text>
<g><title>The agent's own prompt, 256 to 16,384 tokens, shared with no other agent. Its first request prefills it, in both lanes.</title><rect x="0" y="34" width="100" height="30" rx="2" fill="none" stroke="#ef5350" stroke-width="1.5"/><text x="50" y="53" class="d-lab" text-anchor="middle">prompt</text></g>
<text x="50" y="88" class="d-sub" text-anchor="middle">256–16,384 tok</text>
<path d="M102,49 H118" class="d-arrow" marker-end="url(#dArrow)"/>
<text x="120" y="29" class="d-step">think</text>
<g><title>decode 32 tokens on adapter ad25</title><rect x="120" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="140" y="53" class="d-chip" text-anchor="middle">ad25</text></g>
<g><title>decode 32 tokens on adapter ad57</title><rect x="163" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="183" y="53" class="d-chip" text-anchor="middle">ad57</text></g>
<g><title>decode 32 tokens on adapter ad34</title><rect x="206" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="226" y="53" class="d-chip" text-anchor="middle">ad34</text></g>
<g><title>decode 32 tokens on adapter ad14</title><rect x="249" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="269" y="53" class="d-chip" text-anchor="middle">ad14</text></g>
<g><title>decode 32 tokens on adapter ad24</title><rect x="292" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="312" y="53" class="d-chip" text-anchor="middle">ad24</text></g>
<g><title>decode 32 tokens on adapter ad4</title><rect x="335" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="355" y="53" class="d-chip" text-anchor="middle">ad4</text></g>
<g><title>decode 32 tokens on adapter ad2</title><rect x="378" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="398" y="53" class="d-chip" text-anchor="middle">ad2</text></g>
<g><title>decode 32 tokens on adapter ad40</title><rect x="421" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="441" y="53" class="d-chip" text-anchor="middle">ad40</text></g>
<path d="M120,70 v4 H461 v-4" class="d-rule"/>
<text x="290.5" y="88" class="d-sub" text-anchor="middle">decode 256 tokens · switching adapter every 32</text>
<path d="M463,49 H479" class="d-arrow" marker-end="url(#dArrow)"/>
<text x="481" y="29" class="d-step">act</text>
<g><title>A tool call: calculator (1–10 ms), SQL lookup (5–50 ms) or RAG retrieval (20–80 ms), slept for real. Both lanes make the same calls.</title><rect x="481" y="34" width="92" height="30" rx="2" fill="#fff176"/><text x="527" y="53" class="d-chip" text-anchor="middle">tool call</text></g>
<text x="527" y="88" class="d-sub" text-anchor="middle">1–80 ms</text>
<path d="M575,49 H591" class="d-arrow" marker-end="url(#dArrow)"/>
<text x="593" y="29" class="d-step">think</text>
<g><title>decode 32 tokens on adapter ad41</title><rect x="593" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="613" y="53" class="d-chip" text-anchor="middle">ad41</text></g>
<g><title>decode 32 tokens on adapter ad10</title><rect x="636" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="656" y="53" class="d-chip" text-anchor="middle">ad10</text></g>
<g><title>decode 32 tokens on adapter ad7</title><rect x="679" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="699" y="53" class="d-chip" text-anchor="middle">ad7</text></g>
<g><title>decode 32 tokens on adapter ad47</title><rect x="722" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="742" y="53" class="d-chip" text-anchor="middle">ad47</text></g>
<g><title>decode 32 tokens on adapter ad45</title><rect x="765" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="785" y="53" class="d-chip" text-anchor="middle">ad45</text></g>
<g><title>decode 32 tokens on adapter ad26</title><rect x="808" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="828" y="53" class="d-chip" text-anchor="middle">ad26</text></g>
<g><title>decode 32 tokens on adapter ad54</title><rect x="851" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="871" y="53" class="d-chip" text-anchor="middle">ad54</text></g>
<g><title>decode 32 tokens on adapter ad56</title><rect x="894" y="34" width="40" height="30" rx="2" fill="#4fc3f7"/><text x="914" y="53" class="d-chip" text-anchor="middle">ad56</text></g>
<path d="M593,70 v4 H934 v-4" class="d-rule"/>
<text x="763.5" y="88" class="d-sub" text-anchor="middle">another 256 tokens</text>
<path d="M936,49 H952" class="d-arrow" marker-end="url(#dArrow)"/>
<g><title>Done: the agent's last token. Its slot goes to the next agent.</title><rect x="954" y="34" width="64" height="30" rx="2" fill="none" stroke="#66bb6a" stroke-width="1.5"/><text x="986" y="53" class="d-lab" text-anchor="middle">done</text></g>
<text x="986" y="88" class="d-sub" text-anchor="middle">512 tok</text>
<text x="0" y="112" class="d-note">Shown: 512 tokens. At 1,024 tokens an agent thinks 4 times, with 3 tool calls between; at 128 or 256, it calls none.</text>
<text x="0" y="145" class="d-h">AT EACH SWITCH · WHERE THE LANES DIFFER</text>
<rect x="712.4" y="137" width="9" height="9" rx="1" fill="#4fc3f7"/>
<text x="726.4" y="145" class="d-sub">decode</text>
<rect x="780.2" y="137" width="9" height="9" rx="1" fill="#ef5350"/>
<text x="794.2" y="145" class="d-sub">prefill</text>
<rect x="854.3" y="137" width="9" height="9" rx="1" fill="#80deea"/>
<text x="868.3" y="145" class="d-sub">round trip</text>
<rect x="947.3" y="137" width="9" height="9" rx="1" fill="#fff176"/>
<text x="961.3" y="145" class="d-sub">tool call</text>
<text x="0" y="165" class="d-lane">lora-vllm</text>
<text x="0" y="181" class="d-sub">stock vLLM LoRA</text>
<g><title>decode 32 tokens on adapter ad25</title><rect x="130" y="156" width="48" height="24" rx="2" fill="#4fc3f7"/><text x="154" y="172" class="d-chip" text-anchor="middle">ad25</text></g>
<g><title>round trip: 2–10 ms between the agent and the server, before the next request</title><rect x="180" y="156" width="8" height="24" rx="2" fill="#80deea"/></g>
<g><title>prefill: the whole context so far, computed again (vLLM caches it per adapter)</title><rect x="190" y="156" width="100" height="24" rx="2" fill="#ef5350"/><text x="240" y="172" class="d-chip" text-anchor="middle">prefill again</text></g>
