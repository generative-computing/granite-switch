<g><title>decode 32 tokens on adapter ad34</title><rect x="230" y="212" width="48" height="24" rx="2" fill="#4fc3f7"/><text x="254" y="228" class="d-chip" text-anchor="middle">ad34</text></g>
<g><title>decode 32 tokens on adapter ad14</title><rect x="280" y="212" width="48" height="24" rx="2" fill="#4fc3f7"/><text x="304" y="228" class="d-chip" text-anchor="middle">ad14</text></g>
