<svg viewBox="-16 -16 1056 340" width="1056" height="340" role="img" aria-labelledby="dTitle-machine dDesc-machine" xmlns="http://www.w3.org/2000/svg">
<title id="dTitle-machine">The ReAct agent as a state machine</title>
<desc id="dDesc-machine">The ReAct agent as a state machine: from its prompt it thinks, prepares a tool call (perhaps several), acts (calls the tool), observes the result and either acts again or reflects, then starts its next cycle; it ends when its tokens run out.</desc>
<defs><marker id="dArrow-machine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
<style>
  text { font-family: 'IBM Plex Mono', Consolas, 'Cascadia Code', Monaco, monospace; }
  .d-h    { fill: #9a9a9a; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
  .d-step { fill: #bdbdbd; font-size: 11px; font-weight: 600; }
  .d-lane { fill: #9cdcfe; font-size: 12px; font-weight: 600; }
  .d-chip { fill: #1e1e1e; font-size: 10px; }
  .d-lab  { fill: #cccccc; font-size: 11px; }
  .d-sub  { fill: #8a8a8a; font-size: 10.5px; }
  .d-note { fill: #8a8a8a; font-size: 11px; }
  .d-arrow, .d-rule { stroke: #666; stroke-width: 1; fill: none; }
  .d-node     { fill: #e0e0e0; font-size: 12px; font-weight: 600; }
  .d-node-sub { fill: #8fb8cc; font-size: 10.5px; }
  .d-node-tool     { fill: #1e1e1e; font-size: 12px; font-weight: 600; }
  .d-node-tool-sub { fill: #3a3a1e; font-size: 10.5px; }
  .d-node-tag { fill: #6f6f6f; font-size: 9.5px; letter-spacing: 0.04em; }
  .d-term     { fill: #2a2a2a; stroke: #9e9e9e; stroke-width: 1.5; }
  .d-term-lab { fill: #bdbdbd; font-size: 9.5px; font-weight: 700; }
  .d-edge     { stroke: #8a8a8a; stroke-width: 1.3; fill: none; }
  .d-edge-end { stroke-dasharray: 4 3; stroke: #66bb6a; }
  .d-edge-lab { fill: #9a9a9a; font-size: 10px; }
</style>
<rect x="-16" y="-16" width="1056" height="340" fill="#1e1e1e"/>
<text x="0" y="11" class="d-h">THE AGENT · A REACT LOOP, THE SAME IN BOTH LANES</text>
<path d="M46,104 H94" class="d-edge" marker-end="url(#dArrow-machine)"/>
<path d="M236,104 H294" class="d-edge" marker-end="url(#dArrow-machine)"/>
<text x="266" y="96" class="d-edge-lab" text-anchor="middle">decide</text>
<path d="M436,104 H494" class="d-edge" marker-end="url(#dArrow-machine)"/>
<text x="466" y="96" class="d-edge-lab" text-anchor="middle">call</text>
<path d="M636,104 H694" class="d-edge" marker-end="url(#dArrow-machine)"/>
<text x="666" y="96" class="d-edge-lab" text-anchor="middle">result</text>
<path d="M766,129 V230 H538" class="d-edge" marker-end="url(#dArrow-machine)"/>
<text x="651" y="222" class="d-edge-lab" text-anchor="middle">reflect</text>
<path d="M396,230 H166 V131" class="d-edge" marker-end="url(#dArrow-machine)"/>
<text x="281" y="222" class="d-edge-lab" text-anchor="middle">next cycle</text>
<path d="M836,114 H960 V208" class="d-edge d-edge-end" marker-end="url(#dArrow-machine)"/>
<text x="934" y="234" class="d-edge-lab" text-anchor="end">tokens done</text>
<g><title>The agent's prompt: 256 to 16,384 tokens, its own. Its first request prefills it.</title><circle cx="26" cy="104" r="20" class="d-term"/><text x="26" y="108" class="d-term-lab" text-anchor="middle">START</text></g>
<g><title>think (generation): reasons about the task. Median 120 tokens; switches adapter as it starts 35% of the time, and again inside it: 1 + Poisson(2) segments.</title><rect x="96" y="79" width="140" height="50" rx="8" fill="#1e2a33" stroke="#4fc3f7" stroke-width="1.5"/><text x="166" y="99" class="d-node" text-anchor="middle">think</text><text x="166" y="116" class="d-node-sub" text-anchor="middle">~120 tok · switch 35%</text></g>
<text x="166" y="72" class="d-node-tag" text-anchor="middle">LLM · generation</text>
<g><title>prepare_call (generation): writes the tool call. Median 10 tokens; its own adapter 95% of the time; too short to split.</title><rect x="296" y="79" width="140" height="50" rx="8" fill="#1e2a33" stroke="#4fc3f7" stroke-width="1.5"/><text x="366" y="99" class="d-node" text-anchor="middle">prepare_call</text><text x="366" y="116" class="d-node-sub" text-anchor="middle">~10 tok · switch 95%</text></g>
<text x="366" y="72" class="d-node-tag" text-anchor="middle">LLM · generation</text>
<g><title>act: the tool call. Calculator (1&#8211;10 ms), SQL lookup (5&#8211;50 ms) or RAG retrieval (20&#8211;80 ms), slept for real. Both lanes make the same calls.</title><rect x="496" y="79" width="140" height="50" rx="8" fill="#fff176" stroke="#fff176" stroke-width="1.5"/><text x="566" y="99" class="d-node-tool" text-anchor="middle">act</text><text x="566" y="116" class="d-node-tool-sub" text-anchor="middle">tool call · 1&#8211;80 ms</text></g>
<text x="566" y="72" class="d-node-tag" text-anchor="middle">tool</text>
<g><title>observe (generation): reads the tool's result. Median 35 tokens; switches 80% of the time; 1 + Poisson(0.5) segments.</title><rect x="696" y="79" width="140" height="50" rx="8" fill="#1e2a33" stroke="#4fc3f7" stroke-width="1.5"/><text x="766" y="99" class="d-node" text-anchor="middle">observe</text><text x="766" y="116" class="d-node-sub" text-anchor="middle">~35 tok · switch 80%</text></g>
<text x="766" y="72" class="d-node-tag" text-anchor="middle">LLM · generation</text>
<g><title>reflect (generation): weighs the result. Median 90 tokens; switches 70% of the time; 1 + Poisson(1.5) segments.</title><rect x="396" y="205" width="140" height="50" rx="8" fill="#1e2a33" stroke="#4fc3f7" stroke-width="1.5"/><text x="466" y="225" class="d-node" text-anchor="middle">reflect</text><text x="466" y="242" class="d-node-sub" text-anchor="middle">~90 tok · switch 70%</text></g>
<text x="466" y="198" class="d-node-tag" text-anchor="middle">LLM · generation</text>
<g><title>The agent's last token (128 to 1,024 tokens), wherever its cycle stands. Its slot goes to the next agent.</title><circle cx="960" cy="230" r="20" class="d-term"/><text x="960" y="234" class="d-term-lab" text-anchor="middle">END</text></g>
<text x="0" y="286" class="d-note">Each LLM node shows its median tokens and how often it switches adapter as it starts; think, observe and reflect also switch inside.</text>
<text x="0" y="300" class="d-note">The state passed between nodes is the agent's context; an agent stops when its 128&#8211;1,024 tokens are done, at any node.</text>
</svg>
