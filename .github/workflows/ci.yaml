# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Run the exact same hooks as the local pre-commit stage (ruff, toml/yaml
      # validity, link/import validation, SPDX headers, whitespace/EOF, uv-lock,
      # nbstripout, ...) so CI and pre-commit can never drift. `uv` must be on
      # PATH for the uv-lock hook.
      #
      # `version` must stay equal to the uv-pre-commit `rev` in
      # .pre-commit-config.yaml. Left unset, setup-uv installs the newest uv,
      # which drifts from that rev on every upstream release; the uv-lock hook
      # then rewrites uv.lock and fails with "files were modified by this hook".
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.4"
          enable-cache: true

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always

  test-cpu:
    name: CPU Tests (Python ${{ matrix.python-version }})
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # Keep `version` equal to the uv-pre-commit `rev` in .pre-commit-config.yaml.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.4"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # `dev-vllm26`, not `dev`: the dev groups are now named after the vLLM line
      # they install, because the GPU harness keys a stale 0.19.x version assertion
      # off the bare name `dev` (see the comment in pyproject.toml). Nothing here is
      # vLLM-version-specific -- it only needs pytest plus the CPU deps -- but there
      # is one dev group per line and this is the one the lockfile resolves.
      - run: uv sync --frozen --group dev-vllm26 --extra hf --extra compose

      - name: Run CPU tests
        run: |
          # CI runs only tests/unit/ — the fast, self-contained CPU set.
          # The marker filter still applies: tests that download/compose real
          # models (requires_model), need CUDA (gpu), hit the network / take
          # long (slow), or are the expensive code-theory suite (deep) are
          # excluded.
          # tests/composer/ and tests/hf/ are NOT run here: even filtered they
          # are heavy enough to exhaust the GitHub Actions CPU-minutes quota and
          # get killed mid-run. All of that coverage runs on the GPU cluster.
          uv run pytest tests/unit/ \
            -m "not requires_model and not gpu and not slow and not deep" \
            -v -s --tb=short -x \
            --cov=granite_switch --cov-report=xml

      # COVERAGE REPORTING MUST NOT GATE A PR. `fail_ci_if_error: false` already
      # declared that intent, but v4 can fail the step *before* it consults that
      # flag -- it exits nonzero on a token/rate-limit problem of its own, which is
      # what turns a fully green CPU suite red (the "Run CPU tests" step passes on
      # both 3.11 and 3.12; only this step fails). `continue-on-error` enforces the
      # intent at the workflow level, where the action cannot override it. v5 is the
      # supported line; v4 is deprecated.
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
