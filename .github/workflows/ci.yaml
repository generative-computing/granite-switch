# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --extra compose --extra hf

      # Ruff is advisory for now: the repo is not yet ruff-clean, so these steps
      # report findings without failing the build. Flip continue-on-error to
      # false once the dedicated repo-wide formatting PR lands.
      - name: Check formatting
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Check linting
        continue-on-error: true
        run: uv run ruff check .

  test-cpu:
    name: CPU Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --frozen --group dev --extra hf --extra compose

      - name: Run CPU tests
        run: |
          uv run pytest tests/unit/ tests/composer/ tests/hf/ \
            -v -s --tb=short -x \
            --cov=granite_switch --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
